<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buyer Zip Coverage</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
</head>
<body>
  <div id="gate" class="zm-gate" hidden>
    <form class="zm-gate-card" autocomplete="off">
      <div class="zm-gate-t">DBS internal</div>
      <div class="zm-gate-s">Buyer zip coverage map. Team access only.</div>
      <label>Username <input name="u" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
      <label>Password <input name="p" type="password" required></label>
      <button type="submit">Enter</button>
      <div class="zm-gate-err" hidden>That didn't match. Try again.</div>
    </form>
  </div>
  <div id="app"></div>
  <script type="module">
    import { config } from './config.js';
    import { mountZipMap } from './zipmap.js';
    // ?sheet=<id> points the page at a Google Sheet without editing config.js
    const q = new URLSearchParams(location.search);
    if (q.get('sheet')) Object.assign(config, { source: 'sheet', sheetId: q.get('sheet') });
    if (q.get('source')) config.source = q.get('source');
    if (q.get('client')) config.clientId = q.get('client');

    // Team gate. Only a hash of "username:password" lives here. Remembered per browser for 30 days.
    // Regenerate the hash with:  printf 'user:pass' | shasum -a 256
    const GATE_HASH = 'e44d61605e9d13c19bca3685f8746d5c5ecaaf17b9388e1016cb45aa4218380f';
    const GATE_KEY = 'zm.gate';
    const GATE_DAYS = 30;
    // crypto.subtle only exists on https/localhost, so a pure-JS SHA-256 covers plain http.
    const sha256 = async (text) => {
      const bytes = new TextEncoder().encode(text);
      if (globalThis.crypto?.subtle) return [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((b) => b.toString(16).padStart(2, '0')).join('');
      return sha256js(bytes);
    };
    function sha256js(bytes) {
      const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
      let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
      const l = bytes.length, padded = new Uint8Array(((l + 9 + 63) >> 6) << 6);
      padded.set(bytes); padded[l] = 0x80;
      const dv = new DataView(padded.buffer); dv.setUint32(padded.length - 4, l * 8 >>> 0); dv.setUint32(padded.length - 8, Math.floor(l * 8 / 2 ** 32));
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      const w = new Uint32Array(64);
      for (let i = 0; i < padded.length; i += 64) {
        for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
        for (let t = 16; t < 64; t++) { const s0 = rotr(w[t-15], 7) ^ rotr(w[t-15], 18) ^ (w[t-15] >>> 3); const s1 = rotr(w[t-2], 17) ^ rotr(w[t-2], 19) ^ (w[t-2] >>> 10); w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0; }
        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
          const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22), maj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H = H.map((v, i) => (v + [a, b, c, d, e, f, g, h][i]) >>> 0);
      }
      return H.map((v) => v.toString(16).padStart(8, '0')).join('');
    }
    const gateOpen = () => { try { const g = JSON.parse(localStorage.getItem(GATE_KEY) || 'null'); return g && g.h === GATE_HASH && g.exp > Date.now(); } catch { return false; } };
    const gate = document.getElementById('gate');
    const start = () => { gate.hidden = true; mountZipMap('#app', config); };
    if (gateOpen()) start();
    else {
      gate.hidden = false;
      gate.querySelector('form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        let h;
        try { h = await sha256(`${f.u.value.trim()}:${f.p.value}`); }
        catch (e) { const err = f.querySelector('.zm-gate-err'); err.textContent = `Could not check: ${e.message}`; err.hidden = false; return; }
        if (h === GATE_HASH) {
          try { localStorage.setItem(GATE_KEY, JSON.stringify({ h, exp: Date.now() + GATE_DAYS * 864e5 })); } catch {}
          start();
        } else { f.querySelector('.zm-gate-err').hidden = false; f.p.value = ''; f.p.focus(); }
      });
      gate.querySelector('input[name=u]').focus();
    }
  </script>
</body>
</html>
